<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Jak;src:url(../fonts/PlusJakarta.ttf);font-weight:200 800}
body{margin:0;width:512px;height:512px;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(90% 90% at 28% 20%,#FFFCF5 0%,#F8F1E2 45%,#EADDC4 100%)}
.handle{position:absolute;left:300px;top:300px;width:150px;height:56px;border-radius:28px;transform-origin:0 50%;transform:rotate(45deg);
 background:linear-gradient(180deg,#FBF4E6,#E2D2B3 70%,#CDB990);box-shadow:10px 18px 26px rgba(74,58,34,.30),inset 0 3px 3px rgba(255,255,255,.9)}
.rim{position:absolute;left:96px;top:92px;width:300px;height:300px;border-radius:50%;
 background:linear-gradient(145deg,#FFFBF1 0%,#F2E6CE 45%,#D9C6A2 100%);
 box-shadow:18px 26px 44px rgba(74,58,34,.32),-10px -10px 24px rgba(255,253,247,.9),inset 4px 4px 6px rgba(255,255,255,.95),inset -6px -8px 12px rgba(150,118,76,.28)}
.glass{position:absolute;left:36px;top:36px;width:228px;height:228px;border-radius:50%;
 background:radial-gradient(circle at 36% 30%,#3a342b 0%,#28241f 62%,#1c1a16 100%);
 box-shadow:inset 6px 8px 14px rgba(0,0,0,.55),inset -3px -3px 6px rgba(255,248,233,.10),0 0 0 3px rgba(120,96,60,.25)}
.glare{position:absolute;left:24px;top:20px;width:150px;height:150px;border-radius:50%;border-top:5px solid rgba(251,244,228,.30);border-left:5px solid rgba(251,244,228,.10);transform:rotate(-8deg)}
.t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;padding-top:6px}
.a{font:700 104px/1 Jak;color:#F6EFE3;letter-spacing:-.02em;text-shadow:0 3px 6px rgba(0,0,0,.4)}
.z{font:500 84px/1 "Noto Sans CJK JP","Noto Sans CJK TC",sans-serif;color:#D3B07E;margin-top:34px;text-shadow:0 3px 6px rgba(0,0,0,.4)}
</style></head><body><div class="bg"></div><div class="handle"></div>
<div class="rim"><div class="glass"><div class="glare"></div><div class="t"><span class="a">A</span><span class="z">文</span></div></div></div></body></html>
