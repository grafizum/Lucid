<!doctype html>
<meta charset="utf-8">
<title>Lucid — icon foreground</title>
<style>
  @font-face{
    font-family:"Lucid Sans";
    src:url("../fonts/PlusJakarta.ttf") format("truetype-variations");
    font-weight:200 800;
    font-display:block;
  }
  html,body{margin:0;background:transparent;overflow:hidden}
  svg{display:block;width:100vw;height:100vh}
</style>

<!-- The adaptive-icon foreground, drawn in the 108dp grid. The plate itself is
     the background layer, so only the two glyphs live here: cream A, clay 文,
     with one soft shade so they sit on the charcoal rather than float over it. -->
<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF8F1"/>
      <stop offset="1" stop-color="#D8CFBC"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D3A582"/>
      <stop offset="1" stop-color="#A46E4B"/>
    </linearGradient>
    <filter id="shade" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.3" flood-color="#0B0A07" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- Flat, like the palette sheet: the 文 carries a 1.2dp charcoal knockout so it
       reads as a separate mark against the A instead of colliding with it. -->
  <g>
    <text x="40" y="67.2" font-family="Lucid Sans, sans-serif" font-weight="800"
          font-size="44" text-anchor="middle" fill="url(#cream)">A</text>
    <text x="70" y="71.4" font-family="Noto Sans CJK JP, Lucid Sans, sans-serif" font-weight="500"
          font-size="27" text-anchor="middle" fill="url(#clay)"
          stroke="#16150F" stroke-width="1.2" paint-order="stroke">文</text>
  </g>
</svg>
