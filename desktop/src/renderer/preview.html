<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: file:; img-src * data: file:; style-src 'self' 'unsafe-inline'; frame-src 'self' file:; font-src 'self' file:;"
    />
    <title>Lucid — live overlay preview</title>
    <style>
      html,
      body {
        width: 1440px;
        height: 900px;
        margin: 0;
        overflow: hidden;
        background: #0b141a;
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
      }

      #stage {
        position: relative;
        width: 1440px;
        height: 900px;
        overflow: hidden;
      }

      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top left;
      }

      iframe {
        position: absolute;
        border: 0;
        background: transparent;
        color-scheme: normal;
        overflow: hidden;
      }

      #sightFrame { left: 387px; top: 418px; width: 620px; height: 240px; }
      #lensFrame { left: 660px; top: 330px; width: 74px; height: 74px; }
      #panelFrame { left: 1023px; top: 358px; width: 400px; }

      /* subtle screen glass, so the composite reads like a real desktop */
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.02) 0.5px, transparent 0.5px);
        background-size: 3px 3px;
        mix-blend-mode: overlay;
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="bg" src="./stage-whatsapp.png" alt="" />
      <iframe id="sightFrame" src="sight.html" scrolling="no"></iframe>
      <iframe id="lensFrame" src="lens.html" scrolling="no"></iframe>
      <iframe id="panelFrame" src="panel.html" scrolling="no"></iframe>
      <div id="grain"></div>
    </div>

    <script>
      const panelFrame = document.getElementById('panelFrame');

      window.addEventListener('message', (event) => {
        if (!event.data || event.data.type !== 'lucid-panel-height') return;
        const h = Math.max(140, Math.round(event.data.height));
        const top = Math.min(Math.max(418 + 240 - h, 56), 900 - h - 40);
        panelFrame.style.height = h + 'px';
        panelFrame.style.top = top + 'px';
        document.documentElement.dataset.panelHeight = String(h);
        document.documentElement.dataset.panelTop = String(top);
      });

      window.__render = (payload) => {
        panelFrame.contentWindow.__lucidPanel({ status: 'result', ...payload });
        panelFrame.contentWindow.__lucidPanel({ status: 'result', ...payload });
        document.getElementById('lensFrame').contentWindow.__lucidLens({ status: 'ok' });
      };
    </script>
  </body>
</html>
