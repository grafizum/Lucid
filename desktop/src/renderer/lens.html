<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Lucid lens</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        display: grid;
        place-items: center;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="lens" id="lens" role="button" aria-label="Lucid — read this area" title="Click to read · drag to move · right-click for options">
      <div class="lens__halo"></div>
      <div class="lens__plate">
        <div class="lens__ring"></div>
        <svg class="lens__iris" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="6.1" />
          <circle cx="12" cy="12" r="1.45" fill="currentColor" stroke="none" />
          <path d="M12 1.5v3.4M12 19.1v3.4M1.5 12h3.4M19.1 12h3.4" />
        </svg>
      </div>
    </div>

    <script src="lens.js"></script>
  </body>
</html>
