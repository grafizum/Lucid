<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    />
    <title>Lucid sight</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body.sight-visible .sight {
        opacity: 1;
      }
      body {
        background: transparent;
      }

      /* Must read on dark apps and on white documents alike. */
      .sight {
        transition: opacity 0.45s var(--ease), box-shadow 0.45s var(--ease);
        background: radial-gradient(90% 70% at 50% 0%, rgba(123, 241, 198, 0.06), transparent 72%);
        box-shadow:
          inset 0 0 0 1px rgba(123, 241, 198, 0.34),
          inset 0 0 0 2px rgba(0, 0, 0, 0.12),
          inset 0 0 64px -18px rgba(123, 241, 198, 0.22),
          0 0 0 1px rgba(0, 0, 0, 0.16);
      }

      .sight__corner {
        border-color: rgba(123, 241, 198, 0.85);
        border-width: 1.5px;
        filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.45));
      }

      body.is-scanning .sight {
        box-shadow:
          inset 0 0 0 1px rgba(123, 241, 198, 0.6),
          inset 0 0 70px -14px rgba(123, 241, 198, 0.35),
          0 0 0 1px rgba(0, 0, 0, 0.2);
      }

      body.is-scanning .sight__corner {
        border-color: var(--mint);
      }
    </style>
  </head>
  <body class="sight-visible">
    <div class="sight">
      <div class="sight__corner sight__corner--tl"></div>
      <div class="sight__corner sight__corner--tr"></div>
      <div class="sight__corner sight__corner--bl"></div>
      <div class="sight__corner sight__corner--br"></div>
    </div>
    <script>
      if (window.lucid) {
        window.lucid.onSightMode((mode) => {
          document.body.classList.toggle('is-scanning', mode === 'scan');
        });
      }
    </script>
  </body>
</html>
